name: Gerar instaladores AulaPro
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: Aulapro
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - name: Dados OCR offline (português)
        shell: bash
        run: |
          mkdir -p src/ocr
          curl -L -o src/ocr/por.traineddata https://github.com/tesseract-ocr/tessdata_fast/raw/main/por.traineddata
      - run: npm test
        env: { AULAPRO_TESTE: '1' }
      - run: npx electron-builder --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: AulaPro-${{ matrix.os }}
          path: |
            Aulapro/dist/*.exe
            Aulapro/dist/*.dmg
            Aulapro/dist/*.AppImage
            Aulapro/dist/*.deb
